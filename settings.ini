[Display]
; 電荷の表示 (true/false)
showParticles = false

; 結果表示の初期状態 (true/false)
showResults = false

; 3Dモデルの初期状態 (true/false)
show3D = true

; 図記号ではなくイラストを表示するか (true/false)
showIllustrations = false

; 電球の発光係数 k (r = k * sqrt(P))
bulb_glow_k = 30
; 発光半径の最小値 (これ以下は非表示)
bulb_glow_min_r = 5
; 発光半径の最大値 (これ以上は固定)
bulb_glow_max_r = 45

[UI]
; ダークモードの初期状態 (true/false)
darkMode = false

; 絶対値表示の初期状態 (true/false)
showAbsoluteValues = true

; イラストモードの初期状態 (true/false)
illustMode = false

; キャリアの初期状態 (true: 負電荷, false: 正電荷)
electronMode = false

; 粒1個の電気量 (数値は 1, 2, 5, 10, 20, 50, 100, 200, 500、単位は nC, μC, mC, C)
charge_per_particle = 20 mC

[Toolbar]
show_battery = true
show_ac_source = false
show_resistor = true
show_bulb = true
show_capacitor = true
show_inductor = true
show_voltmeter = true
show_ammeter = true
show_wire = true
show_wire_l = true
show_wire_t = true
show_wire_cross = false
show_switch = true
