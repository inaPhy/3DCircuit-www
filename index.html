<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Circuit Simulator</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <!-- Math.js for matrix operations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.js"></script>
</head>
<body>
    <div id="app">
        <!-- 上部パーツパネル -->
        <header id="toolbar">
            <div class="toolbar-container">
                <div class="tool-item" data-type="battery" title="電池">
                    <div class="icon-box" style="background-color: var(--bg-battery);">
                        <svg viewBox="-30 -30 60 60" style="width: 100%; height: 100%; overflow: visible;">
                            <path d="M -30,0 L -6,0 M 6,0 L 30,0" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" />
                            <path d="M -6,-18 L -6,18 M 6,-10 L 6,10" stroke="currentColor" stroke-width="4" fill="none" stroke-linecap="round" />
                        </svg>
                    </div>
                    <span>電池</span>
                </div>
                <div class="tool-item" data-type="resistor" title="抵抗">
                    <div class="icon-box" style="background-color: var(--bg-resistor);">
                        <svg viewBox="-30 -30 60 60" style="width: 100%; height: 100%; overflow: visible;">
                            <path d="M -30,0 L -15,0 M 15,0 L 30,0" stroke="currentColor" stroke-width="2" fill="none" />
                            <rect x="-15" y="-7" width="30" height="14" fill="var(--inner-fill)" stroke="currentColor" stroke-width="2" />
                        </svg>
                    </div>
                    <span>抵抗</span>
                </div>
                <div class="tool-item" data-type="bulb" title="電球">
                    <div class="icon-box" style="background-color: var(--bg-bulb);">
                        <svg viewBox="-30 -30 60 60" style="width: 100%; height: 100%; overflow: visible;">
                            <circle cx="0" cy="0" r="14" fill="var(--inner-fill)" stroke="currentColor" stroke-width="2" />
                            <path d="M -9.9,-9.9 L 9.9,9.9 M -9.9,9.9 L 9.9,-9.9 M -30,0 L -14,0 M 14,0 L 30,0" stroke="currentColor" stroke-width="2" fill="none" />
                        </svg>
                    </div>
                    <span>電球</span>
                </div>
                <div class="tool-item" data-type="capacitor" title="コンデンサー">
                    <div class="icon-box" style="background-color: var(--bg-capacitor);">
                        <svg viewBox="-30 -30 60 60" style="width: 100%; height: 100%; overflow: visible;">
                            <path d="M -30,0 L -6,0 M 6,0 L 30,0" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" />
                            <path d="M -6,-15 L -6,15 M 6,-15 L 6,15" stroke="currentColor" stroke-width="4" fill="none" stroke-linecap="round" />
                        </svg>
                    </div>
                    <span>ｺﾝﾃﾞﾝｻｰ</span>
                </div>
                <div class="tool-item" data-type="inductor" title="コイル">
                    <div class="icon-box" style="background-color: var(--bg-inductor);">
                        <svg viewBox="-30 -30 60 60" style="width: 100%; height: 100%; overflow: visible;">
                            <path d="M -30,0 L -15,0 M 15,0 L 30,0 M -15,0 C -15,-10 -7.5,-10 -7.5,0 C -7.5,-10 0,-10 0,0 C 0,-10 7.5,-10 7.5,0 C 7.5,-10 15,-10 15,0" fill="none" stroke="currentColor" stroke-width="2"/>
                        </svg>
                    </div>
                    <span>コイル</span>
                </div>
                <div class="tool-item" data-type="voltmeter" title="電圧計">
                    <div class="icon-box" style="background-color: var(--bg-voltmeter);">
                        <svg viewBox="-30 -30 60 60" style="width: 100%; height: 100%; overflow: visible;">
                            <path d="M -30,0 L -14,0 M 14,0 L 30,0" fill="none" stroke="currentColor" stroke-width="2"/>
                            <circle cx="0" cy="0" r="14" fill="var(--inner-fill)" stroke="currentColor" stroke-width="2"/>
                            <text x="0" y="0" dominant-baseline="central" text-anchor="middle" font-size="14px" font-weight="bold" fill="currentColor" stroke="none">V</text>
                        </svg>
                    </div>
                    <span>電圧計</span>
                </div>
                <div class="tool-item" data-type="ammeter" title="電流計">
                    <div class="icon-box" style="background-color: var(--bg-ammeter);">
                        <svg viewBox="-30 -30 60 60" style="width: 100%; height: 100%; overflow: visible;">
                            <path d="M -30,0 L -14,0 M 14,0 L 30,0" fill="none" stroke="currentColor" stroke-width="2"/>
                            <circle cx="0" cy="0" r="14" fill="var(--inner-fill)" stroke="currentColor" stroke-width="2"/>
                            <text x="0" y="0" dominant-baseline="central" text-anchor="middle" font-size="14px" font-weight="bold" fill="currentColor" stroke="none">A</text>
                        </svg>
                    </div>
                    <span>電流計</span>
                </div>

                <div class="tool-item" data-type="wire" title="導線(直線)">
                    <div class="icon-box" style="background-color: var(--bg-wire);">
                        <svg viewBox="-30 -30 60 60" style="width: 100%; height: 100%; overflow: visible;">
                            <path d="M -30,0 L 30,0" stroke="currentColor" stroke-width="2" fill="none" />
                        </svg>
                    </div>
                    <span>直線</span>
                </div>
                <div class="tool-item" data-type="wire_l" title="導線(L字)">
                    <div class="icon-box" style="background-color: var(--bg-wire);">
                        <svg viewBox="-30 -30 60 60" style="width: 100%; height: 100%; overflow: visible;">
                            <path d="M 0,-30 L 0,0 L 30,0" stroke="currentColor" stroke-width="2" fill="none" />
                        </svg>
                    </div>
                    <span>L字</span>
                </div>
                <div class="tool-item" data-type="wire_t" title="導線(T字)">
                    <div class="icon-box" style="background-color: var(--bg-wire);">
                        <svg viewBox="-30 -30 60 60" style="width: 100%; height: 100%; overflow: visible;">
                            <path d="M -30,0 L 30,0 M 0,0 L 0,30" stroke="currentColor" stroke-width="2" fill="none" />
                            <circle cx="0" cy="0" r="2" fill="currentColor" stroke="none" />
                        </svg>
                    </div>
                    <span>T字</span>
                </div>
                <div class="tool-item" data-type="switch" title="スイッチ">
                    <div class="icon-box" style="background-color: var(--bg-switch);">
                        <svg viewBox="-30 -30 60 60" style="width: 100%; height: 100%; overflow: visible;">
                            <circle cx="-10" cy="0" r="2" fill="currentColor" stroke="none" />
                            <circle cx="10" cy="0" r="2" fill="currentColor" stroke="none" />
                            <path d="M -30,0 L -10,0 M -10,0 L 10,-10 M 10,0 L 30,0" stroke="currentColor" stroke-width="2" fill="none" />
                        </svg>
                    </div>
                    <span>スイッチ</span>
                </div>
            </div>
        </header>

        <!-- 作業エリア -->
        <main id="workspace">
            <div id="workspace-content" style="display: flex; width: 100%; height: 100%;">
                <div id="grid-canvas-container">
                    <svg id="grid-svg" xmlns="http://www.w3.org/2000/svg">
                        <!-- グリッドの背景線などはjsで生成 -->
                        <g id="grid-lines"></g>
                        <g id="circuit-layer"></g>
                        <g id="ghost-layer"></g>
                        <g id="interaction-layer"></g>
                    </svg>
                </div>
                <div id="canvas-3d-container" style="display: none; flex: 1; border-left: 2px solid var(--glass-border); position: relative; overflow: hidden; background-color: #ffdce6;">
                </div>
            </div>
        </main>

        <!-- 下部コントロールとメッセージ -->
        <footer id="footer" style="justify-content: space-between; padding: 0 10px;">
            <div class="footer-left" style="display: flex; align-items: center; gap: 15px;">
                <button id="solve-btn" class="ok-button" style="background-color: #ffb8c6; color: #1a1b1e; font-weight: bold; text-shadow: none;">OK</button>
                <div id="message-area" class="message-area" style="min-width: 80px;">
                    <p id="error-text">回路を作成</p>
                </div>
            </div>
            
            <div class="footer-center" style="display: flex; align-items: center; gap: 20px;">
                <!-- 速度 -->
                <div style="display:flex; align-items:center; gap:5px;">
                    <span style="color:var(--text-primary); font-size:12px; font-weight:bold;">速度</span>
                    <input type="range" id="time-scale-slider" min="0.001" max="1.0" step="0.001" value="0.1" style="width:80px;">
                    <span id="time-scale-val" style="display:none;">0.1x</span>
                </div>
                
                <!-- 電荷 (Checkbox) -->
                <label class="custom-toggle-label" id="show-particles-toggle" style="display:none; cursor:pointer; align-items:center; gap:5px;" title="電荷">
                    <input type="checkbox" id="show-particles-checkbox" checked style="display:none;">
                    <div class="toggle-icon">
                        <svg viewBox="0 0 30 30" width="24" height="24" style="transition: transform 0.3s; box-shadow: 2px 2px 4px rgba(0,0,0,0.3); border-radius: 4px; display: block;">
                            <rect x="1" y="1" width="28" height="28" fill="#FFFF00" stroke="#333" stroke-width="2" rx="2" />
                            <path d="M 1,12 L 10,12 L 10,20 L 20,20 L 20,12 L 29,12" fill="none" stroke="#333" stroke-width="2" stroke-linejoin="round" />
                        </svg>
                    </div>
                </label>

                <!-- ダークモード (Checkbox) -->
                <label class="custom-toggle-label" style="display:flex; cursor:pointer; align-items:center; gap:5px;" title="ダークモード">
                    <input type="checkbox" id="dark-mode-checkbox" style="display:none;">
                    <div class="toggle-icon">
                        <svg viewBox="0 0 30 30" width="24" height="24" style="transition: transform 0.3s; box-shadow: 2px 2px 4px rgba(0,0,0,0.3); border-radius: 4px; display: block;">
                            <rect x="1" y="1" width="28" height="28" fill="#666666" stroke="#333" stroke-width="2" rx="2" />
                            <path d="M 1,12 L 10,12 L 10,20 L 20,20 L 20,12 L 29,12" fill="none" stroke="#333" stroke-width="2" stroke-linejoin="round" />
                        </svg>
                    </div>
                </label>

                <!-- 結果一覧 (Toggle) -->
                <label class="custom-toggle-label" id="results-toggle-container" style="display:none; cursor:pointer; align-items:center; gap:5px;" title="結果一覧">
                    <input type="checkbox" id="results-toggle-checkbox" style="display:none;">
                    <div class="toggle-icon">
                        <svg viewBox="0 0 30 30" width="24" height="24" style="transition: transform 0.3s; box-shadow: 2px 2px 4px rgba(0,0,0,0.3); border-radius: 4px; display: block;">
                            <rect x="1" y="1" width="28" height="28" fill="#FFFFFF" stroke="#333" stroke-width="2" rx="2" />
                            <path d="M 1,12 L 10,12 L 10,20 L 20,20 L 20,12 L 29,12" fill="none" stroke="#333" stroke-width="2" stroke-linejoin="round" />
                        </svg>
                    </div>
                </label>
            </div>
            
            <div class="footer-right">
                <div id="trash-can" class="trash-box">
                    <div class="trash-icon">🗑️</div>
                </div>
            </div>
        </footer>

        <!-- パラメータ編集ダイアログ -->
        <div id="param-modal" class="modal">
            <div class="modal-content" style="position: relative;">
                <span id="modal-cancel" style="position: absolute; top: 10px; right: 15px; cursor: pointer; font-size: 20px; font-weight: bold; color: var(--text-primary); line-height: 1; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; background-color: rgba(0,0,0,0.1); border-radius: 50%;">&times;</span>
                <h3 id="modal-title">パラメータ変更</h3>
                <div class="input-group" id="input-group-number">
                    <label for="comp-value" id="comp-value-label" style="display: block; margin-bottom: 5px; font-size: 14px; color: var(--text-secondary);">値:</label>
                    <div style="display: flex; align-items: center; justify-content: center; gap: 5px;">
                        <input type="number" id="comp-value" step="any" min="0">
                        <span id="comp-unit" style="font-size: 18px; font-weight: bold;">Ω</span>
                    </div>
                </div>
                <div class="input-group" id="input-group-switch" style="display: none; margin-top: 5px;">
                    <label for="comp-switch-val">状態:</label>
                    <select id="comp-switch-val" style="padding: 5px; border-radius: 4px; background: rgba(255,255,255,0.1); color: white; border: 1px solid var(--glass-border); width: 120px;">
                        <option value="1">ON (結線)</option>
                        <option value="0">OFF (切断)</option>
                    </select>
                </div>
                <div class="modal-btns" style="display: flex; justify-content: space-between; align-items: center; margin-top: 15px;">
                    <button id="modal-delete" style="background-color: transparent; color: #fa5252; border: 1px solid #fa5252; padding: 4px 10px; font-size: 12px; border-radius: 4px;">削除</button>
                    <button id="modal-save">保存</button>
                </div>
            </div>
        </div>

        <!-- 結果一覧パネル -->
        <div id="results-panel" class="results-panel" style="display:none; top:70px; right:20px;">
            <div id="results-panel-header" style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--glass-border); padding-bottom:5px; margin-bottom:10px; cursor:move;">
                <h4 style="margin:0; pointer-events:none;">解析結果</h4>
                <span id="close-results-btn" style="cursor:pointer; font-size:20px; font-weight:bold; color:var(--text-primary); width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; background-color: rgba(0,0,0,0.1); border-radius: 50%; line-height:1;">&times;</span>
            </div>
            <table id="results-table">
                <thead>
                    <tr><th>素子(位置)</th><th>電圧(V)</th><th>電流(A)</th></tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>

        <!-- ツールチップ (マウスオーバー用) -->
        <div id="tooltip" class="tooltip"></div>
    </div>

    <script src="lib/three.min.js"></script>
    <script src="lib/OrbitControls.js"></script>
    <script src="simulator.js"></script>
    <script src="simulator3d.js"></script>
    <script src="main.js"></script>
</body>
</html>
