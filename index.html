<!DOCTYPE html>
<html lang="ja" data-version-title="3D Circuit www">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Circuit www</title>
    <meta name="theme-color" content="#ffffff">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="3D Circuit">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icons/app-icon-192.png" sizes="192x192" type="image/png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" sizes="180x180">
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;400;600&display=swap"
        rel="stylesheet">
    <!-- Math.js for matrix operations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.js"></script>
</head>

<body>
    <div id="app">
        <!-- 上部パーツパネル -->
        <header id="toolbar">
            <div class="toolbar-container">
                <div class="tool-item" data-type="battery" title="電池">
                    <div class="icon-box" style="background-color: var(--bg-battery);">
                        <svg viewBox="-30 -30 60 60" style="width: 100%; height: 100%; overflow: visible;">
                            <path d="M -30,0 L -6,0 M 6,0 L 30,0" stroke="currentColor" stroke-width="2" fill="none"
                                stroke-linecap="round" />
                            <path d="M -6,-18 L -6,18 M 6,-10 L 6,10" stroke="currentColor" stroke-width="4" fill="none"
                                stroke-linecap="round" />
                        </svg>
                    </div>
                    <span>電池</span>
                </div>
                <div class="tool-item" data-type="ac_source" title="交流電源">
                    <div class="icon-box" style="background-color: var(--bg-ac_source);">
                        <svg viewBox="-30 -30 60 60" style="width: 100%; height: 100%; overflow: visible;">
                            <circle cx="0" cy="0" r="18" fill="var(--inner-fill)" stroke="currentColor"
                                stroke-width="3" />
                            <path d="M -10,0 C -10,-6 -5,-6 0,0 C 5,6 10,6 10,0" stroke="currentColor" stroke-width="2"
                                fill="none" />
                            <path d="M -30,0 L -18,0 M 18,0 L 30,0" stroke="currentColor" stroke-width="2"
                                fill="none" />
                        </svg>
                    </div>
                    <span>交流電源</span>
                </div>
                <div class="tool-item" data-type="resistor" title="抵抗">
                    <div class="icon-box" style="background-color: var(--bg-resistor);">
                        <svg viewBox="-30 -30 60 60" style="width: 100%; height: 100%; overflow: visible;">
                            <path d="M -30,0 L -15,0 M 15,0 L 30,0" stroke="currentColor" stroke-width="2"
                                fill="none" />
                            <rect x="-15" y="-7" width="30" height="14" fill="var(--inner-fill)" stroke="currentColor"
                                stroke-width="2" />
                            <!-- Polarity terminals (Inside panel) -->
                            <circle class="passive-polarity" cx="-26" cy="0" r="4" fill="#ff0000" stroke="currentColor"
                                stroke-width="1" />
                            <circle class="passive-polarity" cx="26" cy="0" r="4" fill="#777777" stroke="currentColor"
                                stroke-width="1" />
                        </svg>
                    </div>
                    <span>抵抗</span>
                </div>
                <div class="tool-item" data-type="bulb" title="電球">
                    <div class="icon-box" style="background-color: var(--bg-bulb);">
                        <svg viewBox="-30 -30 60 60" style="width: 100%; height: 100%; overflow: visible;">
                            <circle cx="0" cy="0" r="14" fill="var(--inner-fill)" stroke="currentColor"
                                stroke-width="2" />
                            <path d="M -9.9,-9.9 L 9.9,9.9 M -9.9,9.9 L 9.9,-9.9 M -30,0 L -14,0 M 14,0 L 30,0"
                                stroke="currentColor" stroke-width="2" fill="none" />
                            <!-- Polarity terminals (Inside panel) -->
                            <circle class="passive-polarity" cx="-26" cy="0" r="4" fill="#ff0000" stroke="currentColor"
                                stroke-width="1" />
                            <circle class="passive-polarity" cx="26" cy="0" r="4" fill="#777777" stroke="currentColor"
                                stroke-width="1" />
                        </svg>
                    </div>
                    <span>電球</span>
                </div>
                <div class="tool-item" data-type="capacitor" title="コンデンサー">
                    <div class="icon-box" style="background-color: var(--bg-capacitor);">
                        <svg viewBox="-30 -30 60 60" style="width: 100%; height: 100%; overflow: visible;">
                            <path d="M -30,0 L -6,0 M 6,0 L 30,0" stroke="currentColor" stroke-width="2" fill="none"
                                stroke-linecap="round" />
                            <path d="M -6,-15 L -6,15 M 6,-15 L 6,15" stroke="currentColor" stroke-width="4" fill="none"
                                stroke-linecap="round" />
                            <!-- Polarity terminals (Inside panel) -->
                            <circle class="passive-polarity" cx="-26" cy="0" r="4" fill="#ff0000" stroke="currentColor"
                                stroke-width="1" />
                            <circle class="passive-polarity" cx="26" cy="0" r="4" fill="#777777" stroke="currentColor"
                                stroke-width="1" />
                        </svg>
                    </div>
                    <span>コンデンサー</span>
                </div>
                <div class="tool-item" data-type="inductor" title="コイル">
                    <div class="icon-box" style="background-color: var(--bg-inductor);">
                        <svg viewBox="-30 -30 60 60" style="width: 100%; height: 100%; overflow: visible;">
                            <path
                                d="M -30,0 L -15,0 M 15,0 L 30,0 M -15,0 C -15,-10 -7.5,-10 -7.5,0 C -7.5,-10 0,-10 0,0 C 0,-10 7.5,-10 7.5,0 C 7.5,-10 15,-10 15,0"
                                fill="none" stroke="currentColor" stroke-width="2" />
                            <!-- Polarity terminals (Inside panel) -->
                            <circle class="passive-polarity" cx="-26" cy="0" r="4" fill="#ff0000" stroke="currentColor"
                                stroke-width="1" />
                            <circle class="passive-polarity" cx="26" cy="0" r="4" fill="#777777" stroke="currentColor"
                                stroke-width="1" />
                        </svg>
                    </div>
                    <span>コイル</span>
                </div>
                <div class="tool-item" data-type="voltmeter" title="電圧計">
                    <div class="icon-box" style="background-color: var(--bg-voltmeter);">
                        <svg viewBox="-30 -30 60 60" style="width: 100%; height: 100%; overflow: visible;">
                            <path d="M -30,0 L -24,0 M 24,0 L 30,0" fill="none" stroke="currentColor"
                                stroke-width="2" />
                            <rect x="-24" y="-24" width="48" height="48" rx="4" fill="#1e3a8a" />
                            <path d="M -18,0 A 18,18 0 0 1 18,0 L 18,4 L -18,4 Z" fill="#f8f9fa"
                                transform="translate(0, -4)" />
                            <line x1="0" y1="8" x2="0" y2="-12" stroke="#e03131" stroke-width="1.8"
                                transform="rotate(-50, 0, 8)" />
                            <text x="0" y="18" text-anchor="middle" font-size="12px" font-weight="bold"
                                fill="white">V</text>
                            <circle cx="-15" cy="18" r="4" fill="#ff4444" />
                            <circle cx="15" cy="18" r="4" fill="#333" />
                        </svg>
                    </div>
                    <span>電圧計</span>
                </div>
                <div class="tool-item" data-type="ammeter" title="電流計">
                    <div class="icon-box" style="background-color: var(--bg-ammeter);">
                        <svg viewBox="-30 -30 60 60" style="width: 100%; height: 100%; overflow: visible;">
                            <path d="M -30,0 L -24,0 M 24,0 L 30,0" fill="none" stroke="currentColor"
                                stroke-width="2" />
                            <rect x="-24" y="-24" width="48" height="48" rx="4" fill="#334155" />
                            <path d="M -18,0 A 18,18 0 0 1 18,0 L 18,4 L -18,4 Z" fill="#f8f9fa"
                                transform="translate(0, -4)" />
                            <line x1="0" y1="8" x2="0" y2="-12" stroke="#e03131" stroke-width="1.8"
                                transform="rotate(-50, 0, 8)" />
                            <text x="0" y="18" text-anchor="middle" font-size="12px" font-weight="bold"
                                fill="white">A</text>
                            <circle cx="-15" cy="18" r="4" fill="#ff4444" />
                            <circle cx="15" cy="18" r="4" fill="#333" />
                        </svg>
                    </div>
                    <span>電流計</span>
                </div>

                <div class="tool-item" data-type="wire" title="導線(直線)">
                    <div class="icon-box" style="background-color: var(--bg-wire);">
                        <svg viewBox="-30 -30 60 60" style="width: 100%; height: 100%; overflow: visible;">
                            <path d="M -30,0 L 30,0" stroke="currentColor" stroke-width="2" fill="none" />
                        </svg>
                    </div>
                    <span>導線ー</span>
                </div>
                <div class="tool-item" data-type="wire_l" title="導線(L字)">
                    <div class="icon-box" style="background-color: var(--bg-wire);">
                        <svg viewBox="-30 -30 60 60" style="width: 100%; height: 100%; overflow: visible;">
                            <path d="M 0,-30 L 0,0 L 30,0" stroke="currentColor" stroke-width="2" fill="none" />
                        </svg>
                    </div>
                    <span>導線L</span>
                </div>
                <div class="tool-item" data-type="wire_t" title="導線(T字)">
                    <div class="icon-box" style="background-color: var(--bg-wire);">
                        <svg viewBox="-30 -30 60 60" style="width: 100%; height: 100%; overflow: visible;">
                            <path d="M -30,0 L 30,0 M 0,0 L 0,30" stroke="currentColor" stroke-width="2" fill="none" />
                            <circle cx="0" cy="0" r="3.5" fill="currentColor" stroke="none" />
                        </svg>
                    </div>
                    <span>導線T</span>
                </div>
                <div class="tool-item" data-type="wire_cross" title="導線(十字)">
                    <div class="icon-box" style="background-color: var(--bg-wire);">
                        <svg viewBox="-30 -30 60 60" style="width: 100%; height: 100%; overflow: visible;">
                            <path d="M -30,0 L 30,0 M 0,-30 L 0,30" stroke="currentColor" stroke-width="2"
                                fill="none" />
                            <circle cx="0" cy="0" r="3.5" fill="currentColor" stroke="none" />
                        </svg>
                    </div>
                    <span>導線＋</span>
                </div>
                <div class="tool-item" data-type="switch" title="スイッチ">
                    <div class="icon-box" style="background-color: var(--bg-switch);">
                        <svg viewBox="-30 -30 60 60" style="width: 100%; height: 100%; overflow: visible;">
                            <circle cx="-10" cy="0" r="2" fill="currentColor" stroke="none" />
                            <circle cx="10" cy="0" r="2" fill="currentColor" stroke="none" />
                            <path d="M -30,0 L -10,0 M -10,0 L 10,-10 M 10,0 L 30,0" stroke="currentColor"
                                stroke-width="2" fill="none" />
                        </svg>
                    </div>
                    <span>スイッチ</span>
                </div>
                <!-- 歯車ボタン (列の中に配置、サイズは元のまま) -->
                <div id="toolbar-settings-btn" class="tool-item"
                    style="cursor:pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 60px;">
                    <div
                        style="width: 60px; height: 60px; display: flex; align-items: center; justify-content: center;">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            style="color: var(--text-secondary);">
                            <circle cx="12" cy="12" r="3"></circle>
                            <path
                                d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z">
                            </path>
                        </svg>
                    </div>
                </div>
            </div>
        </header>

        <!-- ツールバー設定用の背景オーバーレイ -->
        <div id="toolbar-settings-backdrop"
            style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:3400;">
        </div>

        <!-- 全消去確認ダイアログ -->
        <div id="clear-confirm-backdrop"
            style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.4); z-index:4900;">
        </div>
        <div id="clear-confirm-modal"
            style="display:none; position:fixed; top:50%; left:50%; transform:translate(-50%, -50%); width:260px; z-index:5000; padding:20px; text-align:center; background:#ffffff; color:#333; border: 1px solid #ddd; border-radius:12px; box-shadow: 0 8px 32px rgba(0,0,0,0.2);">
            <h4 style="margin:0 0 15px 0; font-size:16px;">まとめてリサイクル？</h4>
            <div style="display:flex; gap:15px; justify-content:center;">
                <button id="clear-yes-btn" class="ok-button"
                    style="flex:1; background:#ff5c7c; color:white; border:none; padding:10px; border-radius:8px; cursor:pointer;">はい</button>
                <button id="clear-no-btn" class="ok-button"
                    style="flex:1; background:#eee; color:#333; border:none; padding:10px; border-radius:8px; cursor:pointer;">いいえ</button>
            </div>
        </div>

        <!-- ツールバー表示設定パネル -->
        <div id="toolbar-settings-panel" class="results-panel">
            <div
                style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--glass-border); padding-bottom:5px; margin-bottom:10px;">
                <h4 style="margin:0; font-size:14px;">設定</h4>
                <span id="close-toolbar-settings-btn" style="cursor:pointer; font-size:18px;">&times;</span>
            </div>

            <!-- ファイル操作 (TOP) -->
            <div style="padding-bottom:12px; margin-bottom:12px; border-bottom:1px solid var(--glass-border);">
                <h4 style="margin:0; font-size:14px; margin-bottom:8px;">ファイル</h4>
                <div style="display:flex; gap:10px;">
                    <button id="save-btn" class="ok-button"
                        style="flex:1; padding: 8px; font-size: 13px; height: auto; background-color: #ff5c7c;">保存</button>
                    <button id="load-btn-trigger" class="ok-button"
                        style="flex:1; padding: 8px; font-size: 13px; height: auto; background-color: var(--glass-bg); color: var(--text-primary); border: 1px solid var(--glass-border);">開く</button>
                </div>
                <button id="copy-link-btn" class="ok-button"
                    style="width:100%; margin-top:10px; padding: 8px; font-size: 13px; height: auto; background-color: var(--glass-bg); color: var(--text-primary); border: 1px solid var(--glass-border);">回路のリンクをコピー</button>
                <input type="file" id="load-file-input" style="display: none;" accept=".json">
            </div>

            <!-- サウンド設定 -->
            <div style="padding-bottom:12px; margin-bottom:12px; border-bottom:1px solid var(--glass-border);">
                <h4 style="margin:0; font-size:14px; margin-bottom:8px;">サウンド</h4>
                <div style="display:flex; align-items:center; justify-content:flex-start; gap:12px;">
                    <label class="switch">
                        <input type="checkbox" id="sound-enable-checkbox" checked>
                        <span class="slider-toggle"></span>
                    </label>
                    <span style="font-size:13px; color:var(--text-primary);">操作音を有効にする</span>
                </div>
            </div>

            <!-- キャリア設定 -->
            <div style="padding-bottom:12px; margin-bottom:12px; border-bottom:1px solid var(--glass-border);">
                <h4 style="margin:0; font-size:14px; margin-bottom:8px;">キャリア設定</h4>
                <div style="display:flex; align-items:center; justify-content:flex-start; gap:12px;">
                    <label class="carrier-switch">
                        <input type="checkbox" id="electron-mode-checkbox">
                        <div class="carrier-thumb"></div>
                        <div class="carrier-slider">
                            <span class="carrier-text-pos">正電荷</span>
                            <span class="carrier-text-neg">電 子</span>
                        </div>
                    </label>
                </div>
            </div>

            <!-- 表示設定 (BOTTOM) -->
            <div id="toolbar-visibility-list-container">
                <h4 style="margin:0; font-size:14px; margin-bottom:8px;">ツールバー表示</h4>
                <div id="toolbar-visibility-list" style="display:flex; flex-direction:column; gap:8px;">
                    <!-- JSで動的に生成 -->
                </div>
            </div>

            <div class="settings-app-info">
                <a href="./manual/" target="_blank" rel="noopener">マニュアルを開く</a>
                <p>Version <span data-app-version>2.94</span></p>
                <p>&copy; 2026 Atsushi Inagaki.</p>
            </div>
        </div>

        <!-- 作業エリア -->
        <main id="workspace">
            <div id="workspace-content" style="position: relative; width: 100%; height: 100%;">
                <div id="grid-canvas-container" style="position: absolute; top:0; left:0; width:100%; height:100%;">
                    <svg id="grid-svg" xmlns="http://www.w3.org/2000/svg">
                        <!-- グリッドの背景線などはjsで生成 -->
                        <g id="grid-lines"></g>
                        <g id="circuit-layer"></g>
                        <g id="ghost-layer"></g>
                        <g id="interaction-layer"></g>
                    </svg>
                </div>
                <div id="canvas-3d-container"
                    style="display: none; position: absolute; top:0; left:0; width:100%; height:100%; pointer-events: none; z-index: 10;">
                </div>
            </div>
        </main>

        <!-- 下部コントロール -->
        <footer id="footer" style="width: 100%; display: flex; justify-content: center; padding: 0;">
            <div class="footer-inner"
                style="width: 900px; max-width: 100%; height: 100%; display: flex; justify-content: space-between; align-items: center; padding: 0 20px;">
                <div class="footer-left" style="display: flex; align-items: center;">
                    <button id="solve-btn" class="ok-button"
                        style="background-color: #ffb8c6; color: #1a1b1e; font-weight: bold; text-shadow: none;">OK</button>
                </div>

                <div class="footer-center" style="display: flex; align-items: center; gap: 20px;">
                    <!-- 速度 -->
                    <div style="display:flex; align-items:center; gap:8px;">
                        <span class="slider-label"
                            style="color:var(--text-primary); font-size:12px; font-weight:bold;">stop</span>
                        <div class="time-scale-box" style="position:relative; width:120px; height:45px; display:flex; align-items:center;">
                            <span id="time-scale-val"
                                style="position:absolute; top:-8px; left:10%; transform:translateX(-50%); font-size:11px; font-weight:bold; color:var(--text-primary); pointer-events:none; white-space:nowrap; background:rgba(255,255,255,0.8); padding:0 3px; border-radius:3px; color:#000; z-index:20;">0.10x</span>
                            <input type="range" id="time-scale-slider" min="0" max="1.0" step="0.05" value="0.1"
                                style="width:100%; margin:0; margin-top:15px; z-index:10;" class="custom-slider">
                        </div>
                        <span class="slider-label"
                            style="color:var(--text-primary); font-size:12px; font-weight:bold;">fast</span>
                    </div>

                    <!-- 絶対値切り替え (Checkbox) -->
                    <label class="custom-toggle-label"
                        style="display:flex; cursor:pointer; align-items:center; gap:5px;" title="絶対値・正負号">
                        <input type="checkbox" id="abs-mode-checkbox" style="display:none;" checked>
                        <div class="toggle-icon">
                            <svg viewBox="0 0 30 30" width="24" height="24"
                                style="transition: transform 0.3s; border-radius: 4px; display: block;">
                                <rect x="1" y="1" width="28" height="28" fill="#ced4da" stroke="#333" stroke-width="2"
                                    rx="2" />
                                <!-- OFF state text: ± -->
                                <text class="text-off" x="15" y="15" dominant-baseline="central" text-anchor="middle"
                                    font-size="16px" font-weight="bold" fill="#333" pointer-events="none">±</text>
                                <!-- ON state text: ABS (inverted so it looks correct when flipped) -->
                                <text class="text-on" x="15" y="-15" dominant-baseline="central" text-anchor="middle"
                                    font-size="8px" font-weight="bold" fill="#333" pointer-events="none"
                                    transform="scale(1,-1)">ABS</text>
                            </svg>
                        </div>
                    </label>

                    <!-- イラスト表示切り替え (Checkbox) -->
                    <label class="custom-toggle-label"
                        style="display:flex; cursor:pointer; align-items:center; gap:5px;" title="図記号・イラスト">
                        <input type="checkbox" id="illustration-checkbox" style="display:none;">
                        <div class="toggle-icon">
                            <svg viewBox="0 0 30 30" width="24" height="24"
                                style="transition: transform 0.3s; border-radius: 4px; display: block;">
                                <rect x="1" y="1" width="28" height="28" stroke="#333" stroke-width="2" rx="2" />
                                <path d="M 1,12 L 10,12 L 10,20 L 20,20 L 20,12 L 29,12" fill="none" stroke="#333"
                                    stroke-width="2" stroke-linejoin="round" />
                            </svg>
                        </div>
                    </label>

                    <!-- ダークモード (Checkbox) -->
                    <label class="custom-toggle-label"
                        style="display:flex; cursor:pointer; align-items:center; gap:5px;" title="ダークモード">
                        <input type="checkbox" id="dark-mode-checkbox" style="display:none;">
                        <div class="toggle-icon">
                            <svg viewBox="0 0 30 30" width="24" height="24"
                                style="transition: transform 0.3s; border-radius: 4px; display: block;">
                                <rect x="1" y="1" width="28" height="28" fill="#666666" stroke="#333" stroke-width="2"
                                    rx="2" />
                                <path d="M 1,12 L 10,12 L 10,20 L 20,20 L 20,12 L 29,12" fill="none" stroke="#333"
                                    stroke-width="2" stroke-linejoin="round" />
                            </svg>
                        </div>
                    </label>

                    <!-- 電荷 (Checkbox) -->
                    <label class="custom-toggle-label" id="show-particles-toggle"

                    <button id="modal-meter-details-toggle"
                        style="background:none; border:none; padding:0; cursor:pointer; color:var(--text-secondary); display:none; transition: transform 0.3s ease;">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"></circle>
                            <polyline points="8 12 12 16 16 12"></polyline>
                            <line x1="12" y1="8" x2="12" y2="16"></line>
                        </svg>
                    </button>

                    <button id="modal-ac-toggle"
                        style="background:none; border:none; padding:0; cursor:pointer; color:var(--text-secondary); display:none; transition: transform 0.3s ease;">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"></circle>
                            <polyline points="8 12 12 16 16 12"></polyline>
                            <line x1="12" y1="8" x2="12" y2="16"></line>
                        </svg>
                    </button>

                    <button id="modal-save">保存</button>
                </div>
            </div>
        </div>

        <!-- 結果表示エリア: 横長画面では横並び、縦長画面では縦並び -->
        <div id="results-dock" class="results-dock graph-mode-i">
        <!-- 結果一覧パネル -->
        <div id="results-panel" class="results-panel">
            <div id="results-panel-header"
                style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--glass-border); padding-bottom:5px; margin-bottom:10px; cursor:move;">
                <h4 style="margin:0; pointer-events:none;">解析結果</h4>
                <span id="close-results-btn"
                    style="cursor:pointer; font-size:20px; font-weight:bold; color:#333333; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; background-color: rgba(0,0,0,0.1); border-radius: 50%; line-height:1;">&times;</span>
            </div>
            <table id="results-table">
                <thead>
                    <tr>
                        <th>素子(位置)</th>
                        <th>電圧(V)</th>
                        <th>電流(A)</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>

        <!-- 電圧グラフパネル -->
        <div id="voltage-graph-panel" class="results-panel">
            <div id="voltage-graph-header"
                style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--glass-border); padding-bottom:5px; margin-bottom:10px; cursor:move;">
                <h4 id="voltage-graph-title" style="margin:0; pointer-events:none; font-size: 14px; color:#fab005;">電圧波形
                    (V)</h4>
                <div class="graph-mode-toggle" role="group" aria-label="表示するグラフ">
                    <button type="button" data-graph-mode="v">電圧</button>
                    <button type="button" data-graph-mode="i">電流</button>
                </div>
                <span id="close-voltage-graph-btn"
                    style="cursor:pointer; font-size:20px; font-weight:bold; color:#333333; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; background-color: rgba(0,0,0,0.1); border-radius: 50%; line-height:1;">&times;</span>
            </div>
            <div
                style="position:relative; width:100%; height:180px; background: var(--graph-inner-bg); border-radius:8px; overflow:hidden; border: 1px solid rgba(250, 176, 5, 0.2);">
                <canvas id="voltage-graph-canvas" width="320" height="180" style="width:100%; height:100%;"></canvas>
            </div>

            <div style="margin-top:4px; display:flex; align-items:center; gap:10px;">
                <input type="range" id="graph-v-range-slider" min="0.1" max="100" step="0.1" value="10"
                    style="flex:1; height:4px; cursor:pointer;">
                <span id="graph-v-range-val"
                    style="font-size:11px; color:var(--text-secondary); font-family: 'Roboto Mono', monospace; min-width:40px; text-align:right;">10.0V</span>
            </div>
            <div id="voltage-graph-legend"
                style="margin-top:8px; display:grid; grid-template-columns: 1fr 1fr; gap:5px; border-top: 1px solid var(--glass-border); padding-top:5px;">
                <!-- Legend items injected by JS -->
            </div>
        </div>

        <!-- 電流グラフパネル -->
        <div id="current-graph-panel" class="results-panel">
            <div id="current-graph-header"
                style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--glass-border); padding-bottom:5px; margin-bottom:10px; cursor:move;">
                <h4 id="current-graph-title" style="margin:0; pointer-events:none; font-size: 14px; color:#4dabf7;">電流波形
                    (A)</h4>
                <div class="graph-mode-toggle" role="group" aria-label="表示するグラフ">
                    <button type="button" data-graph-mode="v">電圧</button>
                    <button type="button" data-graph-mode="i">電流</button>
                </div>
                <span id="close-current-graph-btn"
                    style="cursor:pointer; font-size:20px; font-weight:bold; color:#333333; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; background-color: rgba(0,0,0,0.1); border-radius: 50%; line-height:1;">&times;</span>
            </div>
            <div
                style="position:relative; width:100%; height:180px; background: var(--graph-inner-bg); border-radius:8px; overflow:hidden; border: 1px solid rgba(77, 171, 247, 0.2);">
                <canvas id="current-graph-canvas" width="320" height="180" style="width:100%; height:100%;"></canvas>
            </div>

            <div style="margin-top:4px; display:flex; align-items:center; gap:10px;">
                <input type="range" id="graph-i-range-slider" min="0.01" max="10" step="0.01" value="1.0"
                    style="flex:1; height:4px; cursor:pointer;">
                <span id="graph-i-range-val"
                    style="font-size:11px; color:var(--text-secondary); font-family: 'Roboto Mono', monospace; min-width:40px; text-align:right;">1.00A</span>
            </div>
            <div id="current-graph-legend"
                style="margin-top:8px; display:grid; grid-template-columns: 1fr 1fr; gap:5px; border-top: 1px solid var(--glass-border); padding-top:5px;">
                <!-- Legend items injected by JS -->
            </div>
        </div>

        </div>

        <!-- ツールチップ (マウスオーバー用) -->
        <div id="tooltip" class="tooltip"></div>
    </div>

    <script src="version.js"></script>
    <script src="lib/three.min.js"></script>
    <script src="lib/OrbitControls.js"></script>
    <script src="simulator.js"></script>
    <script src="simulator3d.js"></script>
    <script src="main.js"></script>
</body>

</html>
